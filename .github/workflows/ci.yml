name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Verify installation
        run: python scripts/verify_install.py

      - name: Check generated samples
        run: |
          python samples/fsi/tools/generate_packages.py --check
          python samples/customer_transaction_risk/tools/generate_demo.py --check

      - name: Validate FSI corpus
        run: python samples/fsi/tools/validate_corpus.py
